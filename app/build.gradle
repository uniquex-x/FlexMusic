apply plugin: 'com.android.application'

import java.util.Properties

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { inputStream ->
        localProperties.load(inputStream)
    }
}

def resolveReleaseConfig = { String localKey, String gradleKey, String envKey ->
    return (
            localProperties.getProperty(localKey)
                    ?: project.findProperty(gradleKey)
                    ?: System.getenv(envKey)
                    ?: ""
    ).toString().trim()
}

def releaseStoreFilePath = resolveReleaseConfig("release.storeFile", "releaseStoreFile", "FLEXMUSIC_RELEASE_STORE_FILE")
def releaseStorePassword = resolveReleaseConfig("release.storePassword", "releaseStorePassword", "FLEXMUSIC_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = resolveReleaseConfig("release.keyAlias", "releaseKeyAlias", "FLEXMUSIC_RELEASE_KEY_ALIAS")
def releaseKeyPassword = resolveReleaseConfig("release.keyPassword", "releaseKeyPassword", "FLEXMUSIC_RELEASE_KEY_PASSWORD")
def hasReleaseSigning = !releaseStoreFilePath.isEmpty()
        && !releaseStorePassword.isEmpty()
        && !releaseKeyAlias.isEmpty()
        && !releaseKeyPassword.isEmpty()

android {
    namespace 'com.example.flexmusicplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.flexmusicplayer"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
//        coreLibraryDesugaringEnabled true
    }
    buildFeatures {
        viewBinding true
    }
    ndkVersion '25.2.9519653'

    applicationVariants.all { variant ->
        if (variant.buildType.name != "release") {
            return
        }
        variant.outputs.all { output ->
            outputFileName = "FlexMusic-${variant.name}-v${variant.versionName}-${variant.versionCode}.apk"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
//    implementation libs.desugar.jdk.libs
    testImplementation libs.junit
    implementation "androidx.activity:activity:1.7.2"
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation project(":core_data")
    implementation project(":core_domain")
    implementation project(":core_network")
    implementation project(":feature_player")
    implementation project(":feature_transcode")
    implementation project(":feature_search")
}
