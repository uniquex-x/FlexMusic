plugins {
    id 'com.android.library'
}

import java.util.Properties

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { inputStream ->
        localProperties.load(inputStream)
    }
}

def resolveNetworkConfig = { String localKey, String gradleKey, String envKey, String fallbackValue ->
    return (
            localProperties.getProperty(localKey)
                    ?: project.findProperty(gradleKey)
                    ?: System.getenv(envKey)
                    ?: fallbackValue
    ).toString().trim()
}

android {
    namespace 'com.example.core_network'
    compileSdk 28

    def jamendoClientId = (
            localProperties.getProperty("jamendo.clientId")
                    ?: project.findProperty("jamendoClientId")
                    ?: System.getenv("JAMENDO_CLIENT_ID")
                    ?: ""
    ).toString()
    def supabaseUrl = resolveNetworkConfig(
            "supabase.url",
            "supabaseUrl",
            "SUPABASE_URL",
            "")
    def supabasePublishableKey = resolveNetworkConfig(
            "supabase.publishableKey",
            "supabasePublishableKey",
            "SUPABASE_PUBLISHABLE_KEY",
            "")

    defaultConfig {
        minSdk 21

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        buildConfigField "String", "JAMENDO_CLIENT_ID", "\"${jamendoClientId.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", "\"${supabasePublishableKey.replace("\\", "\\\\").replace("\"", "\\\"")}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation project(":core_domain")
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
